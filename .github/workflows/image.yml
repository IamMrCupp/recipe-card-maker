# Build (PRs) and publish (main) the home-base container image (Phase 4α).
#
# PRs: amd64 build-only — proves the Dockerfile assembles, fast.
# main: multi-arch linux/arm64 (the rpi-k8s cluster) + linux/amd64 (local use),
#       pushed to GHCR as :latest + :<sha>. The cluster's Flux image-automation
#       watches :latest and rolls the Deployment by digest (see cluster-management
#       repo, websites/mrcupp/image-repository.yaml for the documented pattern).
name: Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/iammrcupp/recipe-card-maker

jobs:
  image:
    name: Build${{ github.event_name == 'push' && ' + push' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up QEMU (arm64 emulation)
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name == 'push' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
