name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint + test + check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python (from .python-version)
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint + format check)
        run: make lint

      - name: Pytest
        run: make test

      - name: Sanity-parse all recipes
        run: make check

  web:
    name: Build PWA frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '_web/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: _web

      - name: Build
        run: npm run build
        working-directory: _web
